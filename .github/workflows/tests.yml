name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated tests without credentials
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Check CLI help
        run: python -X utf8 assistant.py --help
      - name: Check installer help
        run: python -X utf8 install_skill.py --help
      - name: Check PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./run-assistant.ps1 --help
